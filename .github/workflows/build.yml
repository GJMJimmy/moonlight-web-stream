name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y pkg-config zip
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: dist/

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnu, x86_64-unknown-linux-gnu, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: static
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          set -e
          T=${{ matrix.target }}
          OUT=moonlight-web-$T
          mkdir -p "$OUT/static"
          cp -r static/* "$OUT/static/"
          for bin in web-server streamer; do
            if [ "$T" = "x86_64-pc-windows-gnu" ]; then
              cp "target/$T/release/$bin.exe" "$OUT/"
            else
              cp "target/$T/release/$bin" "$OUT/"
            fi
          done
          if [ "$T" = "x86_64-pc-windows-gnu" ]; then
            (cd "$OUT" && zip -r "../$OUT.zip" .)
          else
            tar -czf "$OUT.tar.gz" "$OUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-web-${{ matrix.target }}
          path: |
            moonlight-web-*.zip
            moonlight-web-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" artifacts/*/moonlight-web-* --repo "$GITHUB_REPOSITORY" --clobber
